      <e:let name="stateAccentColor">(enabled and state) ? accent ? accentColorOn : isLight ? whiteColor_ : blackColor_ : isLight ? whiteColor30 : blackColor30</e:let>
      <e:let name="accentColor70">withAlpha(accentColorOn, 0.7)</e:let>
