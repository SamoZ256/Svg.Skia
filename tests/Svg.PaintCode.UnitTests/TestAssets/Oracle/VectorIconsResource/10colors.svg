<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" xmlns:e="https://svg.skia/expr/1.0">
  <defs>
    <linearGradient id="gradientpurple" gradientUnits="userSpaceOnUse" x1="7" y1="14" x2="7" y2="0">
      <stop offset="0" stop-color="{{ ((enabled and state) ? accent ? #fc772fff : isLight ? whiteColor_ : blackColor_ : isLight ? whiteColor30 : blackColor30) }}" />
      <stop offset="0.5" stop-color="{{ ((enabled and state) ? accent ? #fc534bff : isLight ? #ffffffff : #1f2123d9 : isLight ? #ffffff4d : #1f212333) }}" />
      <stop offset="1" stop-color="{{ ((enabled and state) ? accent ? colorPurple : isLight ? whiteColor_ : blackColor70 : isLight ? whiteColor30 : blackColor10) }}" />
    </linearGradient>
    <linearGradient id="gradientshine" gradientUnits="userSpaceOnUse" x1="7" y1="14" x2="7" y2="0">
      <stop offset="0.0073" stop-color="{{ ((enabled and state) ? accent ? #ffee3eff : isLight ? whiteColor_ : blackColor_ : isLight ? whiteColor30 : blackColor30) }}" />
      <stop offset="0.5037" stop-color="{{ ((enabled and state) ? accent ? #ffe23dff : isLight ? #ffffffff : #1f2123d9 : isLight ? #ffffff4d : #1f212333) }}" />
      <stop offset="1" stop-color="{{ ((enabled and state) ? accent ? #ffd73cff : isLight ? whiteColor_ : blackColor70 : isLight ? whiteColor30 : blackColor10) }}" />
    </linearGradient>
    <linearGradient id="gradienttemperature" gradientUnits="userSpaceOnUse" x1="7" y1="14" x2="7" y2="0">
      <stop offset="0" stop-color="#fb002b" />
      <stop offset="0.6217" stop-color="#904395" />
      <stop offset="1" stop-color="#2586ff" />
    </linearGradient>
    <e:code>
      <e:param name="step" type="number" default="2" />
      <e:param name="enabled" type="boolean" default="true" />
      <e:param name="state" type="boolean" default="true" />
      <e:param name="accent" type="boolean" default="true" />
      <e:param name="isLight" type="boolean" default="false" />
      <e:param name="whiteColor_" type="color" default="#ffffffff" />
      <e:param name="blackColor_" type="color" default="#1f2123ff" />
      <e:param name="colorPurple" type="color" default="#fc2f67ff" />
      <e:param name="colorGreen" type="color" default="#4ec36bff" />
      <e:let name="step0">step == 0</e:let>
      <e:let name="whiteColor30">withAlpha(whiteColor_, 0.3)</e:let>
      <e:let name="blackColor30">withAlpha(blackColor_, 0.3)</e:let>
      <e:let name="blackColor70">withAlpha(blackColor_, 0.7)</e:let>
      <e:let name="blackColor10">withAlpha(blackColor_, 0.1)</e:let>
      <e:let name="step1">step == 1</e:let>
      <e:let name="step2">step == 2</e:let>
      <e:let name="step3">step == 3</e:let>
      <e:let name="stateBlueColor">(enabled and state) ? accent ? #0bbeffff : isLight ? whiteColor_ : blackColor_ : isLight ? whiteColor30 : blackColor30</e:let>
      <e:let name="step4">step == 4</e:let>
      <e:let name="stateNavyColor">(enabled and state) ? accent ? #1d6cffff : isLight ? whiteColor_ : blackColor_ : isLight ? whiteColor30 : blackColor30</e:let>
      <e:let name="step5">step == 5</e:let>
      <e:let name="step6">step == 6</e:let>
      <e:let name="stateBrownColor">(enabled and state) ? accent ? #98665cff : isLight ? whiteColor_ : blackColor_ : isLight ? whiteColor30 : blackColor30</e:let>
      <e:let name="step7">step == 7</e:let>
      <e:let name="stateWhiteColor">(enabled and state) ? not isLight ? whiteColor_ : blackColor_ : not isLight ? whiteColor30 : blackColor30</e:let>
      <e:let name="step8">step == 8</e:let>
      <e:let name="stateBlackColor">(enabled and state) ? isLight ? whiteColor_ : blackColor_ : isLight ? whiteColor30 : blackColor30</e:let>
      <e:let name="step9">step == 9</e:let>
    </e:code>
  </defs>
  <ellipse id="0" cx="7" cy="7" rx="7" ry="7" fill="#808080" display="{{ step0 }}" transform="translate(1,1)" />
  <ellipse id="1" cx="7" cy="7" rx="7" ry="7" fill="url(#gradientpurple)" display="{{ step1 }}" transform="translate(1,1)" />
  <ellipse id="2" cx="7" cy="7" rx="7" ry="7" fill="url(#gradientshine)" display="{{ step2 }}" transform="translate(1,1)" />
  <ellipse id="3" cx="7" cy="7" rx="7" ry="7" fill="{{ colorGreen }}" display="{{ step3 }}" transform="translate(1,1)" />
  <ellipse id="4" cx="7" cy="7" rx="7" ry="7" fill="{{ stateBlueColor }}" display="{{ step4 }}" transform="translate(1,1)" />
  <ellipse id="5" cx="7" cy="7" rx="7" ry="7" fill="{{ stateNavyColor }}" display="{{ step5 }}" transform="translate(1,1)" />
  <ellipse id="6" cx="7" cy="7" rx="7" ry="7" fill="url(#gradienttemperature)" display="{{ step6 }}" transform="translate(1,1)" />
  <ellipse id="7" cx="7" cy="7" rx="7" ry="7" fill="{{ stateBrownColor }}" display="{{ step7 }}" transform="translate(1,1)" />
  <ellipse id="8" cx="7" cy="7" rx="7" ry="7" fill="{{ stateWhiteColor }}" display="{{ step8 }}" transform="translate(1,1)" />
  <ellipse id="9" cx="7" cy="7" rx="7" ry="7" fill="{{ stateBlackColor }}" display="{{ step9 }}" transform="translate(1,1)" />
</svg>
