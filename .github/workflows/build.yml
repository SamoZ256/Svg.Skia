name: Build

on:
  push:
    branches:
      - master
      - main
      - develop
      - 'feature/**'
      - 'release/**'
  pull_request:
    branches:
      - master
      - main
      - develop

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Determine version suffix
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/heads/release/* ]]; then
            echo "VERSION_SUFFIX=" >> "$GITHUB_ENV"
          else
            echo "VERSION_SUFFIX=-build.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi

      - name: Restore
        run: dotnet restore Svg.Skia.slnx

      - name: Build
        run: dotnet build Svg.Skia.slnx -c Release --no-restore -p:VersionSuffix="${{ env.VERSION_SUFFIX }}"

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: build
    permissions:
      contents: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Determine version suffix
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/heads/release/* ]]; then
            echo "VERSION_SUFFIX=" >> "$GITHUB_ENV"
          else
            echo "VERSION_SUFFIX=-build.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi

      - name: Restore
        run: dotnet restore Svg.Skia.slnx

      - name: Build
        run: dotnet build Svg.Skia.slnx -c Release --no-restore -p:VersionSuffix="${{ env.VERSION_SUFFIX }}"

      - name: Test
        run: dotnet test Svg.Skia.slnx -c Release --no-build --logger trx --results-directory artifacts/test

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: artifacts/test/**/*.trx
          if-no-files-found: error
          retention-days: 7

      - name: Publish test results
        uses: dorny/test-reporter@v1
        # Fork and Dependabot PR tokens cannot create check runs; TRX artifacts still upload above.
        if: ${{ always() && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')) }}
        with:
          name: Test Results (${{ matrix.os }})
          path: artifacts/test/**/*.trx
          reporter: dotnet-trx
          fail-on-empty: false

  build-maui:
    name: Build MAUI (macos-latest)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install .NET MAUI workload
        working-directory: src/SvgML.Maui
        run: dotnet workload install maui --ignore-failed-sources --skip-manifest-update

      - name: Determine version suffix
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/heads/release/* ]]; then
            echo "VERSION_SUFFIX=" >> "$GITHUB_ENV"
          else
            echo "VERSION_SUFFIX=-build.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi

      - name: Restore libraries
        working-directory: src/SvgML.Maui
        run: |
          dotnet restore SvgML.Maui.csproj
          dotnet restore ../Svg.Controls.Skia.Maui/Svg.Controls.Skia.Maui.csproj

      - name: Build libraries
        working-directory: src/SvgML.Maui
        run: |
          dotnet build SvgML.Maui.csproj -c Release --no-restore -p:VersionSuffix="${{ env.VERSION_SUFFIX }}"
          dotnet build ../Svg.Controls.Skia.Maui/Svg.Controls.Skia.Maui.csproj -c Release --no-restore -p:VersionSuffix="${{ env.VERSION_SUFFIX }}"

      - name: Build sample
        working-directory: src/SvgML.Maui
        run: dotnet build ../../samples/SvgML.Maui.Demo/SvgML.Maui.Demo.csproj -f net10.0-android -c Release -p:RuntimeIdentifier=android-arm64

  pack:
    name: Pack (ubuntu-latest)
    runs-on: ubuntu-latest
    needs: [build, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Determine version suffix
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/heads/release/* ]]; then
            echo "VERSION_SUFFIX=" >> "$GITHUB_ENV"
          else
            echo "VERSION_SUFFIX=-build.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi

      - name: Restore
        run: dotnet restore Svg.Skia.slnx

      - name: Pack
        run: dotnet pack Svg.Skia.slnx -c Release --no-restore -p:VersionSuffix="${{ env.VERSION_SUFFIX }}" -o artifacts/packages

      - name: Verify Linux package dependencies
        run: bash scripts/verify_linux_package_dependencies.sh artifacts/packages

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages-ubuntu-latest
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          if-no-files-found: error
          retention-days: 30

  publish-apps:
    name: Publish apps (${{ matrix.rid }})
    # Default branch only. build, test and pack still run on every branch and pull request -- this
    # gates the job, not the workflow. Publishing four self-contained runtimes is around 360 MB a
    # time, which is not worth spending on a branch still being iterated on. Written against
    # default_branch rather than 'master' so a rename does not silently disable it, matching how
    # the docs deploy job gates itself.
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    runs-on: ${{ matrix.os }}
    needs: [build, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          # macos-latest runners are Apple Silicon; the Intel build is produced from the same
          # runner, which works because the runtime packs come from NuGet rather than the host.
          - os: macos-latest
            rid: osx-arm64
          - os: macos-latest
            rid: osx-x64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Determine version suffix
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/heads/release/* ]]; then
            echo "VERSION_SUFFIX=" >> "$GITHUB_ENV"
          else
            echo "VERSION_SUFFIX=-build.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi

      # Self-contained, so neither app needs a .NET install on the machine that runs it. Not
      # trimmed: Avalonia and the SVG object model both reflect over types, and a trimmed build
      # fails at runtime rather than at publish, which is the worst place to find out.
      - name: Publish svgc
        run: >
          dotnet publish samples/svgc/svgc.csproj -c Release -r ${{ matrix.rid }}
          --self-contained true -p:VersionSuffix="${{ env.VERSION_SUFFIX }}"
          -o artifacts/publish/${{ matrix.rid }}/svgc

      - name: Publish Svg.Studio
        run: >
          dotnet publish src/Svg.Studio/Svg.Studio.csproj -c Release -r ${{ matrix.rid }}
          --self-contained true -p:VersionSuffix="${{ env.VERSION_SUFFIX }}"
          -o artifacts/publish/${{ matrix.rid }}/Svg.Studio

      - name: Upload apps
        uses: actions/upload-artifact@v4
        with:
          name: apps-${{ matrix.rid }}
          path: artifacts/publish/${{ matrix.rid }}
          if-no-files-found: error
          retention-days: 30

  pack-maui:
    name: Pack MAUI (macos-latest)
    runs-on: macos-latest
    needs: build-maui
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install .NET MAUI workload
        working-directory: src/SvgML.Maui
        run: dotnet workload install maui --ignore-failed-sources --skip-manifest-update

      - name: Determine version suffix
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/heads/release/* ]]; then
            echo "VERSION_SUFFIX=" >> "$GITHUB_ENV"
          else
            echo "VERSION_SUFFIX=-build.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi

      - name: Restore
        working-directory: src/SvgML.Maui
        run: |
          dotnet restore SvgML.Maui.csproj
          dotnet restore ../Svg.Controls.Skia.Maui/Svg.Controls.Skia.Maui.csproj

      - name: Pack
        working-directory: src/SvgML.Maui
        run: |
          dotnet pack SvgML.Maui.csproj -c Release --no-restore -p:VersionSuffix="${{ env.VERSION_SUFFIX }}" -o ../../artifacts/maui-packages
          dotnet pack ../Svg.Controls.Skia.Maui/Svg.Controls.Skia.Maui.csproj -c Release --no-restore -p:VersionSuffix="${{ env.VERSION_SUFFIX }}" -o ../../artifacts/maui-packages

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages-maui-macos-latest
          path: |
            artifacts/maui-packages/*.nupkg
            artifacts/maui-packages/*.snupkg
          if-no-files-found: error
          retention-days: 30
