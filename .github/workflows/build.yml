name: Build

# Linux only, and the whole suite: locally only the test projects a change reaches run. Windows,
# Studio UI and the packs run in release.yml. Master's ruleset does not require a branch to be up to
# date with it, so two pull requests can each pass and still clash once both land; the push run on
# master is what catches that.
on:
  pull_request:
    branches:
      - master
      - main
      - develop
  push:
    branches:
      - master
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test (ubuntu-latest)
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # setup-dotnet's own cache needs packages.lock.json, which this repository does not keep.
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Packages.props', 'build/*.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Svg.Skia.slnx -p:Configuration=Release

      - name: Build
        run: dotnet build Svg.Skia.slnx -c Release --no-restore

      - name: Test
        run: dotnet test Svg.Skia.slnx -c Release --no-build --logger trx --results-directory artifacts/test

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-ubuntu-latest
          path: artifacts/test/**/*.trx
          if-no-files-found: error
          retention-days: 7

      - name: Publish test results
        uses: dorny/test-reporter@v1
        # Fork and Dependabot PR tokens cannot create check runs; TRX artifacts still upload above.
        if: ${{ always() && (github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')) }}
        with:
          name: Test Results (ubuntu-latest)
          path: artifacts/test/**/*.trx
          reporter: dotnet-trx
          fail-on-empty: false

  publish-apps:
    name: Publish apps (${{ matrix.rid }})
    # By hand only: four self-contained runtimes are around 360 MB a time.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          # macos-latest runners are Apple Silicon; the Intel build is produced from the same
          # runner, which works because the runtime packs come from NuGet rather than the host.
          - os: macos-latest
            rid: osx-arm64
          - os: macos-latest
            rid: osx-x64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Self-contained, so neither app needs a .NET install on the machine that runs it. Not
      # trimmed: Avalonia and the SVG object model both reflect over types, and a trimmed build
      # fails at runtime rather than at publish, which is the worst place to find out.
      - name: Publish svgc
        run: >
          dotnet publish src/svgc/svgc.csproj -c Release -r ${{ matrix.rid }}
          --self-contained true -p:VersionSuffix="-build.${{ github.run_number }}"
          -o artifacts/publish/${{ matrix.rid }}/svgc

      # On macOS as Svg.Studio.app, which is what Finder opens a .svgstudio with.
      - name: Publish Svg.Studio
        run: >
          dotnet publish src/Svg.Studio/Svg.Studio.csproj -c Release -r ${{ matrix.rid }}
          --self-contained true -p:VersionSuffix="-build.${{ github.run_number }}"
          -p:StudioAppBundle=${{ startsWith(matrix.rid, 'osx') }}
          -o artifacts/publish/${{ matrix.rid }}/Svg.Studio

      - name: Upload apps
        uses: actions/upload-artifact@v4
        with:
          name: apps-${{ matrix.rid }}
          path: artifacts/publish/${{ matrix.rid }}
          if-no-files-found: error
          retention-days: 30
