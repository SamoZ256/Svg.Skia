name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 11.3.9)'
        required: true
        type: string
      prerelease:
        description: 'Is this a pre-release?'
        required: false
        type: boolean
        default: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: Build Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is-prerelease: ${{ steps.version.outputs.is-prerelease }}
      version-suffix: ${{ steps.version.outputs.version-suffix }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.version }}"
            IS_PRERELEASE="${{ github.event.inputs.prerelease }}"
          else
            # Extract version from tag (e.g., v11.3.9 -> 11.3.9)
            VERSION="${GITHUB_REF#refs/tags/v}"
            # Check if it's a prerelease (contains -, e.g., 11.3.9-preview1)
            if [[ "$VERSION" == *"-"* ]]; then
              IS_PRERELEASE="true"
            else
              IS_PRERELEASE="false"
            fi
          fi
          # Only the suffix reaches the packages; the prefixes stay in Directory.Build.props, tracking
          # upstream's, so the suffix is what numbers successive fork releases of the same base.
          if [[ "$VERSION" != *"-"* ]]; then
            echo "::error::Tag a fork release with a suffix, e.g. v5.2.2-samoz.1"
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version-suffix=${VERSION#*-}" >> $GITHUB_OUTPUT
          echo "is-prerelease=$IS_PRERELEASE" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION (prerelease: $IS_PRERELEASE)"

      - name: Restore
        run: dotnet restore Svg.Skia.slnx

      - name: Build
        run: dotnet build Svg.Skia.slnx -c Release --no-restore

  test:
    name: Test Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Svg.Skia.slnx

      - name: Build
        run: dotnet build Svg.Skia.slnx -c Release --no-restore

      - name: Test
        run: dotnet test Svg.Skia.slnx -c Release --no-build --logger trx --results-directory artifacts/test

      - name: Upload test results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: release-test-results
          path: artifacts/test/**/*.trx
          if-no-files-found: error
          retention-days: 7

      - name: Publish test results
        uses: dorny/test-reporter@3eeb9fc888e82e8be2fb356bbeec2750231672bc # v1, 2026-10-31
        if: always()
        with:
          name: Release Test Results
          path: artifacts/test/**/*.trx
          reporter: dotnet-trx
          fail-on-empty: false

  pack:
    name: Pack Release
    runs-on: ubuntu-latest
    needs: [build, test]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Svg.Skia.slnx

      - name: Pack
        run: dotnet pack Svg.Skia.slnx -c Release --no-restore -p:VersionSuffix="${{ needs.build.outputs.version-suffix }}" -o artifacts/packages

      - name: Verify Linux package dependencies
        run: bash scripts/verify_linux_package_dependencies.sh artifacts/packages

      - name: Upload NuGet packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-nuget-packages
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          if-no-files-found: error
          retention-days: 90

  pack-maui:
    name: Pack MAUI Release
    runs-on: macos-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x

      - name: Install .NET MAUI workload
        working-directory: src/SvgML.Maui
        run: dotnet workload install maui --ignore-failed-sources --skip-manifest-update

      - name: Restore libraries
        working-directory: src/SvgML.Maui
        run: |
          dotnet restore SvgML.Maui.csproj
          dotnet restore ../Svg.Controls.Skia.Maui/Svg.Controls.Skia.Maui.csproj

      - name: Build libraries
        working-directory: src/SvgML.Maui
        run: |
          dotnet build SvgML.Maui.csproj -c Release --no-restore -p:VersionSuffix="${{ needs.build.outputs.version-suffix }}"
          dotnet build ../Svg.Controls.Skia.Maui/Svg.Controls.Skia.Maui.csproj -c Release --no-restore -p:VersionSuffix="${{ needs.build.outputs.version-suffix }}"

      - name: Pack
        working-directory: src/SvgML.Maui
        run: |
          dotnet pack SvgML.Maui.csproj -c Release --no-restore -p:VersionSuffix="${{ needs.build.outputs.version-suffix }}" -o ../../artifacts/maui-packages
          dotnet pack ../Svg.Controls.Skia.Maui/Svg.Controls.Skia.Maui.csproj -c Release --no-restore -p:VersionSuffix="${{ needs.build.outputs.version-suffix }}" -o ../../artifacts/maui-packages

      - name: Build sample
        working-directory: src/SvgML.Maui
        run: dotnet build ../../samples/SvgML.Maui.Demo/SvgML.Maui.Demo.csproj -f net10.0-android -c Release -p:RuntimeIdentifier=android-arm64

      - name: Upload NuGet packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-maui-nuget-packages
          path: |
            artifacts/maui-packages/*.nupkg
            artifacts/maui-packages/*.snupkg
          if-no-files-found: error
          retention-days: 90

  publish-nuget:
    name: Publish to nuget.org
    runs-on: ubuntu-latest
    needs: [build, pack, pack-maui]
    # Waits for the nuget environment's reviewer before anything goes public. Every action here is
    # pinned to a commit: this job holds an hour's nuget.org key, and a moved tag would run whatever
    # it points at now.
    environment: nuget
    permissions:
      id-token: write
    steps:
      - name: Download NuGet packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-nuget-packages
          path: packages

      - name: Download MAUI NuGet packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-maui-nuget-packages
          path: packages

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'

      # Trusted Publishing: nuget.org trades this job's OIDC token for an API key that lasts an hour,
      # under a policy for SamoZ256/Svg.Skia and release.yml that may publish new SamoZ256.* IDs.
      - name: NuGet login
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      # No .snupkg is made: SourceLink.props embeds the PDBs instead.
      - name: Publish to nuget.org
        run: |
          shopt -s nullglob
          for package in packages/*.nupkg; do
            echo "Publishing $package..."
            dotnet nuget push "$package" \
              --api-key ${{ steps.login.outputs.NUGET_API_KEY }} \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build, pack, pack-maui, publish-nuget]
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive

      - name: Download NuGet packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-nuget-packages
          path: packages

      - name: Download MAUI NuGet packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-maui-nuget-packages
          path: packages

      - name: Create GitHub Release
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1, which is v0.1.15
        with:
          name: Svg.Skia v${{ needs.build.outputs.version }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ needs.build.outputs.is-prerelease == 'true' }}
          generate_release_notes: true
          files: |
            packages/*.nupkg
            packages/*.snupkg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
